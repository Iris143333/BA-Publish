<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>数据血缘 · Lineage Explorer</title>
  <link rel="stylesheet" href="styles.css?v=20260720-field-graph-trace">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">L</span><div><strong>Lineage Explorer</strong><small>只读元数据工作台</small></div></div>
    <div class="search-wrap">
      <input id="search" autocomplete="off" placeholder="搜索视图或物化视图…">
      <div id="results" class="search-results hidden"></div>
    </div>
    <div class="header-status"><span class="pulse"></span><span id="datasetStatus">加载元数据…</span></div>
  </header>

  <main>
    <aside class="sidebar">
      <button class="collapse-side" data-collapse="left" title="收起左侧栏">‹</button>
      <div class="sidebar-section">
        <label>当前分析对象</label>
        <div id="currentObject" class="current-object">尚未选择对象</div>
        <div class="history-controls"><button id="backButton" disabled>← Back</button><button id="forwardButton" disabled>Forward →</button></div>
        <div id="breadcrumb" class="breadcrumb">搜索一个对象后开始追溯</div>
      </div>
      <div class="sidebar-section controls">
        <label>搜索与筛选</label>
        <select id="schemaFilter"><option value="">All schemas</option></select>
        <select id="typeFilter"><option value="">All object types</option></select>
        <select id="domainFilter"><option value="">All business modules</option></select>
        <input id="objectSearch" placeholder="搜索并定位对象…">
        <div id="objectResults" class="object-results hidden"></div>
      </div>
      <div class="sidebar-section controls">
        <label>血缘方向</label>
        <select id="directionSelect"><option value="upstream">Upstream</option><option value="downstream">Downstream</option><option value="both">Both</option></select>
        <label>完整展开</label>
        <button id="fullUpstream" class="secondary">Full Upstream</button>
        <button id="fullDownstream" class="secondary">Full Downstream</button>
        <button id="fullLineage" class="secondary">Full Lineage</button>
        <button id="collapseOneLevel" class="secondary">Collapse to One Level</button>
        <button id="terminalSources" class="toggle"><span>Terminal Sources</span><b>Off</b></button>
        <label>画布</label>
        <button id="toggleInternal" class="toggle"><span>Technical View</span><b>Off</b></button>
        <button id="fitGraph" class="secondary">适配画布</button>
        <button id="fullScreen" class="secondary">Full Screen</button>
      </div>
      <div class="sidebar-section legend">
        <label>对象图例</label>
        <div><i class="dot table"></i>物理表 / 外部源</div>
        <div><i class="dot view"></i>普通视图</div>
        <div><i class="dot mview"></i>物化视图</div>
        <div><i class="dot cte"></i>CTE</div>
        <div><i class="dot subquery"></i>子查询</div>
        <div><i class="dot union"></i>UNION 分支</div>
      </div>
      <div class="sidebar-section stats" id="stats"></div>
    </aside>

    <section class="workspace">
      <div class="canvas-toolbar">
        <div><strong id="graphTitle">Global Lineage</strong><span id="graphHint">单击查看详情；双击进入完整上游</span></div>
        <div class="zoom-buttons"><button id="zoomOut">−</button><span id="zoomValue">100%</span><button id="zoomIn">＋</button></div>
      </div>
      <div id="graphViewport" class="graph-viewport">
        <svg id="graph" aria-label="数据血缘图"><g id="graphScene"></g></svg>
        <div id="edgeTooltip" class="edge-tooltip hidden"></div>
        <div id="contextMenu" class="context-menu hidden"></div>
        <div id="emptyState" class="empty-state"><div class="loader"></div><p>正在构建血缘图</p></div>
      </div>
    </section>

    <aside id="detailPanel" class="detail-panel">
      <button class="collapse-side" data-collapse="right" title="收起右侧栏">›</button>
      <div class="detail-head"><div><small id="detailEyebrow">节点详情</small><h2 id="detailTitle">选择一个节点</h2></div><button id="closeDetail">×</button></div>
      <div id="detailBody" class="detail-body"><div class="detail-placeholder">点击节点、关系线或字段查看结构化元数据。</div></div>
    </aside>
  </main>
  <script src="global_app.js?v=20260720-field-graph-trace"></script>
</body>
</html>
